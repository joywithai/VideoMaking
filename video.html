<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JWT Explainer — Tech Lobon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --o:#FF6B00; --o2:#ff8c33;
  --glass-bg:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
  --glass-brd:1px solid rgba(255,255,255,.20);
  --glass-sh:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#stageArea{flex:1;position:relative;overflow:hidden;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#0a0a0c}
#playerBar{height:76px;flex:none;background:#0c0c0f;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:18px;padding:0 26px}

.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);
  border:var(--glass-brd);border-radius:28px;box-shadow:var(--glass-sh);position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,.14), transparent);transform:skewX(-18deg);pointer-events:none}
.glass.shine::after{animation:shineSweep 6s ease-in-out infinite}
@keyframes shineSweep{0%{left:-70%}55%{left:130%}100%{left:130%}}

#bgWrap{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:-6%;background:url("BG.jpg") center/cover no-repeat;will-change:transform}
#bg.kb-a{animation:kbA 26s ease-in-out infinite alternate}
#bg.kb-b{animation:kbB 26s ease-in-out infinite alternate}
#bg.kb-c{animation:kbC 26s ease-in-out infinite alternate}
#bg.kb-d{animation:kbD 26s ease-in-out infinite alternate}
@keyframes kbA{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.13) translate(-1.2%,-1.6%)}}
@keyframes kbB{from{transform:scale(1.12) translate(2%,-.6%)}to{transform:scale(1.12) translate(-2%,.6%)}}
@keyframes kbC{from{transform:scale(1.14) translate(-1%,1%)}to{transform:scale(1.03) translate(.4%,0)}}
@keyframes kbD{from{transform:scale(1.06) translate(-2.2%,.8%)}to{transform:scale(1.14) translate(2.2%,-.8%)}}
#tint{position:absolute;inset:0;background:
  radial-gradient(1200px 700px at 50% 42%, rgba(255,107,0,.06), transparent 60%),
  linear-gradient(180deg, rgba(5,5,8,.32) 0%, rgba(5,5,8,.05) 40%, rgba(5,5,8,.55) 100%)}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(0,0,0,.75);pointer-events:none}
#particles{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);opacity:.16;animation:floatUp linear infinite}
.dot.o{background:var(--o2);opacity:.22}
@keyframes floatUp{from{transform:translateY(60px) scale(.7)}to{transform:translateY(-240px) scale(1.15)}}

/* ================= beats ================= */
#beats{position:absolute;inset:0;z-index:10}
.beat{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none}
.beat.active{opacity:1;visibility:visible;transition:opacity .45s ease}
.beat.leaving{opacity:0;visibility:visible;transition:opacity .4s ease}
.el{opacity:0;transform:translateY(26px);transition:opacity .38s ease, transform .38s cubic-bezier(.2,.85,.25,1)}
.el.shown{opacity:1;transform:none}
.el.pop{transform:scale(.72);transition:opacity .35s ease, transform .35s cubic-bezier(.2,1.5,.35,1)}
.el.pop.shown{transform:scale(1)}
.el.left{transform:translateX(-64px)}
.el.right{transform:translateX(64px)}
.el.left.shown,.el.right.shown{transform:translateX(0)}

/* layout bands — overlap-safe zones */
.btop{position:absolute;left:0;right:0;top:95px;display:flex;justify-content:center;align-items:flex-start;gap:30px;flex-wrap:wrap;min-height:150px}
.bmid{position:absolute;left:0;right:0;top:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;min-height:480px}
.row{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;max-width:1740px}
.mono{font-family:'JetBrains Mono',monospace}

.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 30px;border-radius:999px;font-size:30px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18)}
.pill .k{color:var(--o2);font-weight:700}
.pill.warn{background:rgba(255,107,0,.16);border-color:rgba(255,107,0,.45)}
.pill.bad{background:rgba(255,60,60,.14);border-color:rgba(255,80,80,.4)}
.pill.good{background:rgba(40,200,120,.13);border-color:rgba(60,220,140,.4)}
.g\boxed{width:290px;min-height:165px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:22px;border-radius:26px;text-align:center}
.gbox .ic{font-size:50px}
.gbox .t1{font-size:33px;font-weight:700;color:#fff}
.gbox .t2{font-size:21px;color:rgba(255,255,255,.65)}
.gbox.hot{background:rgba(255,107,0,.18);border:2px solid rgba(255,107,0,.5)}
.tokenfly{padding:16px 30px;border-radius:18px;font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;
  color:#fff;background:rgba(255,107,0,.28);border:2px solid rgba(255,107,0,.6);animation:fly 3.2s ease-in-out infinite}
@keyframes fly{0%{transform:translateX(-110px) scale(.85);opacity:0}18%{opacity:1}50%{transform:translateX(0) scale(1);opacity:1}
  82%{opacity:1}100%{transform:translateX(110px) scale(.85);opacity:0}}
.arrow{font-size:50px;color:var(--o);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.code{padding:36px 44px;border-radius:28px;font-family:'JetBrains Mono',monospace;font-size:38px;line-height:1.8;color:#fff;min-width:500px}
.code .key{color:#8ecbff}.code .str{color:var(--o2)}
.wm{font-size:230px;font-weight:700;letter-spacing:10px;color:#fff;text-shadow:0 0 90px rgba(255,107,0,.5),0 18px 60px rgba(0,0,0,.6);display:flex;gap:12px}
.wm .o{color:var(--o)}
.bigtext{font-size:76px;font-weight:700;color:#fff;line-height:1.35;text-align:center}
.bigtext b{color:var(--o2)}
.slab{width:340px;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:30px}
.slab .num{font-size:19px;font-weight:700;color:var(--o2);letter-spacing:2px}
.slab .name{font-size:46px;font-weight:700;color:#fff}
.slab .hint{font-size:21px;color:rgba(255,255,255,.62)}
.slab.on{background:rgba(255,107,0,.16);border:2px solid rgba(255,107,0,.5)}
.dotsep{width:22px;height:22px;border-radius:50%;background:var(--o);box-shadow:0 0 26px rgba(255,107,0,.95);animation:blink 1.5s infinite;flex:none}
.formula{padding:22px 44px;border-radius:22px;font-family:'JetBrains Mono',monospace;font-size:38px;color:#fff}
.formula b{color:var(--o2)}
.claim{padding:22px 30px;border-radius:22px;min-width:235px;text-align:center}
.claim .c1{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:var(--o2)}
.claim .c2{font-size:23px;color:rgba(255,255,255,.72);margin-top:5px}
.grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:1450px}
.vs{display:flex;gap:36px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.vpanel{width:520px;padding:40px 46px;border-radius:30px;text-align:center}
.vpanel .vt{font-size:42px;font-weight:700;color:#fff;margin-bottom:16px}
.vpanel .vs2{font-size:26px;color:rgba(255,255,255,.72);line-height:1.6}
.vpanel .ic{font-size:70px;margin-bottom:14px}
.neq{font-size:72px;font-weight:700;color:var(--o);align-self:center;text-shadow:0 0 40px rgba(255,107,0,.6);flex:none}
.step{display:flex;align-items:center;gap:26px;padding:22px 32px;border-radius:22px;width:1040px}
.step .chk{width:54px;height:54px;border-radius:16px;background:rgba(255,107,0,.2);border:2px solid var(--o);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--o2);font-weight:700;flex:none}
.step .txt{font-size:32px;color:#fff;font-weight:600}
.step .txt small{display:block;font-size:21px;font-weight:500;color:rgba(255,255,255,.62);margin-top:4px}
.timelineWrap{position:relative;width:1300px;height:150px}
.timeline{position:absolute;left:0;right:0;top:30px;height:8px;border-radius:999px;background:rgba(255,255,255,.18)}
.tmark{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:190px}
.tmark i{display:block;width:20px;height:20px;border-radius:50%;background:var(--o);margin:24px auto 10px;box-shadow:0 0 18px rgba(255,107,0,.8)}
.tmark span{font-family:'JetBrains Mono',monospace;font-size:25px;color:#fff;font-weight:700;display:block}
.tmark small{font-size:19px;color:rgba(255,255,255,.6);display:block;margin-top:2px}
.counter{font-family:'JetBrains Mono',monospace;font-size:110px;font-weight:700;color:var(--o2);text-shadow:0 0 60px rgba(255,107,0,.45)}
.cross{position:relative}
.cross::after{content:"✕";position:absolute;right:-8px;top:-12px;font-size:40px;color:#ff4d4d;font-weight:700;text-shadow:0 0 18px rgba(255,60,60,.8)}
.okmark::after{content:"✓";position:absolute;right:-8px;top:-12px;font-size:40px;color:#28c878;font-weight:700;text-shadow:0 0 18px rgba(40,200,120,.8)}
.machine{width:330px;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:30px;
  background:rgba(255,107,0,.16);border:2px solid rgba(255,107,0,.5);animation:machinePulse 2.2s ease-in-out infinite}
@keyframes machinePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,0,.35)}50%{box-shadow:0 0 70px 12px rgba(255,107,0,.28)}}
.machine .mt{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;color:#fff}
.machine .ms{font-size:21px;color:rgba(255,255,255,.7)}
.minipart{padding:15px 26px;border-radius:16px;font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.minipart.hot{background:rgba(255,107,0,.22);border-color:rgba(255,107,0,.55)}
.pkg{width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:90px;border-radius:32px}

/* kinetic fallback subtitles (bottom band, per-line) */
.kin{position:absolute;left:0;right:0;top:850px;text-align:center;padding:0 130px;min-height:150px}
.kw{display:inline-block;margin:0 9px;font-size:50px;font-weight:600;color:#fff;line-height:1.5;
  text-shadow:0 3px 16px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.9)}
.kw.shown{color:#fff}
.kw.klast{color:var(--o2)}

.overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center}
.overlay .card{width:820px;padding:64px 76px;border-radius:40px;text-align:center}
.overlay h1{font-size:68px;color:#fff;font-weight:700;line-height:1.3}
.overlay h1 b{color:var(--o2)}
.overlay p{font-size:28px;color:rgba(255,255,255,.72);margin-top:18px;line-height:1.6}
.bigbtn{margin-top:36px;display:inline-flex;align-items:center;gap:16px;padding:24px 58px;border-radius:999px;border:none;cursor:pointer;
  font-family:inherit;font-size:36px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--o),var(--o2));
  box-shadow:0 26px 70px rgba(255,107,0,.45);transition:transform .15s}
.bigbtn:hover{transform:scale(1.05)}
.hidden{display:none!important}

.btn{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);
  color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.btn:hover{background:rgba(255,107,0,.4)}
#time{font-family:'JetBrains Mono',monospace;font-size:19px;color:rgba(255,255,255,.85);flex:none;letter-spacing:1px}
#track{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.14);cursor:pointer;position:relative}
#trackFill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--o),var(--o2));width:0%}
#trackFill::after{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 4px rgba(255,107,0,.35)}
#err{position:absolute;left:50%;top:30px;transform:translateX(-50%);z-index:70;padding:14px 26px;border-radius:14px;
  background:rgba(180,20,20,.85);color:#fff;font-size:22px;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stageArea">
    <div id="stage">
      <div id="bgWrap"><div id="bg" class="kb-a"></div></div>
      <div id="tint"></div>
      <div id="particles"></div>
      <div id="vignette"></div>
      <div id="beats"></div>
      <div id="err"></div>
    </div>
    <div class="overlay" id="startOverlay">
      <div class="card glass shine">
        <h1>JWT — <b>JSON Web Token</b></h1>
        <p>প্রতি line-এর word অনুযায়ী synced motion-graphics<br>clean board · Liquid Glass · SRT-accurate</p>
        <button class="bigbtn" id="btnStart">▶ ভিডিও প্লে করো</button>
      </div>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <div class="card glass shine">
        <h1>সম্পূর্ণ ভিডিও শেষ ✅</h1>
        <p>decode মানে verify নয় — Signature এবং claims যাচাই বাধ্যতামূলক</p>
        <button class="bigbtn" id="btnAgain">⟲ আবার দেখো</button>
      </div>
    </div>
  </div>
  <div id="playerBar">
    <div class="btn" id="btnPlay">▶</div>
    <div class="btn" id="btnReplay">⟲</div>
    <div id="time">0:00 / 0:00</div>
    <div id="track"><div id="trackFill"></div></div>
    <div class="btn" id="btnMute">🔊</div>
  </div>
</div>
<audio id="audio" src="JWTAudio.mp3" preload="auto"></audio>

/* ============ engine ============ */
const $ = (id) => document.getElementById(id);
const audio = $('audio'), stage = $('stage'), stageArea = $('stageArea');
const trackFill = $('trackFill'), timeEl = $('time');
const startOverlay = $('startOverlay'), endOverlay = $('endOverlay');
const errBox = $('err'), beatsBox = $('beats');
const CUES = DATA.cues, WORDS = DATA.words;

function beatTime(b){
  return [CUES[b.c0].s - 0.12, b.c1 + 1 < CUES.length ? CUES[b.c1 + 1].s - 0.12 : DATA.duration];
}
BEATS.forEach((b, i) => {
  const d = document.createElement('div');
  d.className = 'beat'; d.id = 'beat-' + i; d.innerHTML = b.h;
  beatsBox.appendChild(d);
});

function fit(){
  const r = stageArea.getBoundingClientRect();
  const s = Math.min(r.width / 1920, r.height / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

(function(){
  const box = $('particles');
  for(let i = 0; i < 26; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (Math.random() < .35 ? ' o' : '');
    const s = 3 + Math.random() * 7;
    d.style.width = d.style.height = s + 'px';
    d.style.left = Math.random() * 100 + '%';
    d.style.top = (40 + Math.random() * 60) + '%';
    d.style.animationDuration = (9 + Math.random() * 14) + 's';
    d.style.animationDelay = (-Math.random() * 12) + 's';
    box.appendChild(d);
  }
})();

const KB = ['kb-a','kb-b','kb-c','kb-d'];
let activeBeat = -1;

function triggerAt(el){
  if(el.dataset.w !== undefined) return WORDS[+el.dataset.w][1] + (+el.dataset.t || 0);
  return CUES[+el.dataset.c || 0].s + (+el.dataset.t || 0);
}
function setBeat(t){
  let idx = 0;
  for(let i = 0; i < BEATS.length; i++){ if(t >= beatTime(BEATS[i])[0]) idx = i; }
  if(idx === activeBeat) return;
  const old = activeBeat >= 0 ? $('beat-' + activeBeat) : null;
  if(old){ old.classList.remove('active'); old.classList.add('leaving');
    setTimeout(() => old.classList.remove('leaving'), 450); }
  activeBeat = idx;
  const el = $('beat-' + idx);
  el.querySelectorAll('.el').forEach(x => {
    x.classList.remove('shown');
    if(x.dataset.count) x.textContent = '0';
  });
  el.classList.add('active');
  $('bg').className = KB[idx % KB.length];
}
function tickBeat(){
  if(activeBeat < 0) return;
  const t = audio.currentTime || 0;
  const el = $('beat-' + activeBeat);
  el.querySelectorAll('.el:not(.shown)').forEach(x => {
    if(t >= triggerAt(x)){
      x.classList.add('shown');
      if(x.dataset.count) countUp(x, +x.dataset.count);
    }
  });
}
function countUp(el, target){
  const t0 = performance.now(), dur = 1500;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 3))).toLocaleString('en-US');
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = target.toLocaleString('en-US');
  })(performance.now());
}

function fmt(s){
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function updateUI(t){
  const dur = audio.duration || DATA.duration;
  trackFill.style.width = Math.min(100, (t / dur) * 100) + '%';
  timeEl.textContent = fmt(t) + ' / ' + fmt(dur);
}
function play(){ audio.play().then(() => { $('btnPlay').textContent = '⏸'; }).catch(e => showErr('audio: ' + e.message)); }
function pause(){ audio.pause(); $('btnPlay').textContent = '▶'; }
function toggle(){ audio.paused ? play() : pause(); }
function restart(){
  audio.currentTime = 0; activeBeat = -1;
  endOverlay.classList.add('hidden'); play();
}

$('btnStart').addEventListener('click', () => { startOverlay.classList.add('hidden'); play(); });
$('btnAgain').addEventListener('click', restart);
$('btnPlay').addEventListener('click', toggle);
$('btnReplay').addEventListener('click', restart);
$('btnMute').addEventListener('click', () => {
  audio.muted = !audio.muted;
  $('btnMute').textContent = audio.muted ? '🔇' : '🔊';
});

function seekFromEvent(e){
  const r = $('track').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  audio.currentTime = p * (audio.duration || DATA.duration);
  activeBeat = -1;
}
$('track').addEventListener('mousedown', (e) => {
  seekFromEvent(e);
  const mv = (ev) => seekFromEvent(ev);
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});
stageArea.addEventListener('click', (e) => {
  if(e.target.closest('.overlay') || e.target.closest('button')) return;
  toggle();
});
addEventListener('keydown', (e) => {
  if(e.code === 'Space'){ e.preventDefault(); toggle(); }
  if(e.code === 'ArrowRight') audio.currentTime = Math.min((audio.duration || DATA.duration), audio.currentTime + 5);
  if(e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  if(e.key === 'r' || e.key === 'R') restart();
});

function frame(){
  const t = audio.currentTime || 0;
  setBeat(t); tickBeat(); updateUI(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* audio path: works from FinalOutput/ (JWTAudio.mp3) and repo root (news/JWTAudio.mp3) */
let audioFallback = false;
audio.addEventListener('error', () => {
  if(!audioFallback){
    audioFallback = true;
    audio.src = 'news/JWTAudio.mp3';
    audio.load();
  } else {
    showErr('⚠ audio load হয়নি');
  }
});
audio.addEventListener('ended', () => {
  $('btnPlay').textContent = '▶';
  endOverlay.classList.remove('hidden');
});
function showErr(m){ errBox.textContent = m; errBox.style.display = 'block'; }

setBeat(0); tickBeat(); updateUI(0);
</script>
</body>
</html>
